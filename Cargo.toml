[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.23.0", default-features = false, features = [
  "derive",
] }
pollster = { version = "0.4.0", default-features = false }
wgpu = { version = "25.0.2", default-features = false, features = ["wgsl"] }
cosmic-text = { version = "0.19.0", default-features = false, features = [
  "fontconfig",
  "swash",
], optional = true }
smol_str = { version = "0.3.2", default-features = false }

# Logging dependencies
tracing = { version = "0.1.41", default-features = false, optional = true }
tracy-client = { version = "0.18.4", default-features = false, optional = true }

# Winit dependencies
winit = { version = "0.30.12", default-features = false, optional = true }

# SCTK dependencies
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = [
  "calloop",
  "xkbcommon",
], optional = true }
wayland-backend = { version = "0.3", default-features = false, features = [
  "client_system",
], optional = true }
calloop = { version = "0.14", optional = true }

# svg widget
resvg = { version = "0.46.0", default-features = false, optional = true }

[features]
default = ["text_cosmic"]

text_cosmic = ["dep:cosmic-text"]

vulkan = ["wgpu/vulkan"]
metal = ["wgpu/metal"]

tracing = ["dep:tracing"]
winit = ["dep:winit"]
sctk = ["dep:smithay-client-toolkit", "dep:wayland-backend", "dep:calloop"]

tracy = [
  "dep:tracy-client",
  "tracy-client/enable",
  "tracy-client/ondemand",
  "tracy-client/only-localhost",
]
tracy_full = [
  "tracy",
  "tracy-client/system-tracing",
  "tracy-client/sampling",
  "tracy-client/context-switch-tracing",
]
tracy_broadcast = ["tracy", "tracy-client/broadcast"]
tracy_code_transfer = ["tracy", "tracy-client/code-transfer"]
tracy_widgets = ["tracy"]

svg = [
  "dep:resvg",
  "resvg/text",
  "resvg/system-fonts",
  "resvg/memmap-fonts",
  "resvg/raster-images",
]

[dev-dependencies]
winit = "0.30.12"
image = { version = "0.25.8", features = ["jpeg"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tracing-log = "0.2.0"

[[example]]
name = "winit"
required-features = ["winit"]

[[example]]
name = "sctk-layer"
required-features = ["sctk"]

[[example]]
name = "sctk-window"
required-features = ["sctk"]

[[example]]
name = "sctk-lock"
required-features = ["sctk"]

[[example]]
name = "target-stress"
required-features = ["sctk", "vulkan"]
